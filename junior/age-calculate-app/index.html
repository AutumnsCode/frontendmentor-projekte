<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Age calculator app</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }

  </style>
  <script type="module" src="/src/js/main.js" defer></script>
</head>
<body>
  <main class="wrapper">
    <section class="calculate">
      <form class="calculate-form form">
        <div class="form__header">
          <div class="form-group">
            <label for="day">day</label>
            <input type="text" class="form-input" id="day" inputmode="numeric" pattern="[0-9]+" maxlength="2" placeholder="DD">
            <p class="error" id="day-error">This is error</p>
          </div>
          <div class="form-group">
            <label for="month">month</label>
            <input type="text" class="form-input" id="month" inputmode="numeric" pattern="[0-9]+" maxlength="2" placeholder="MM">
            <p class="error" id="month-error">This is error</p>
          </div>
          <div class="form-group">
            <label for="year">year</label>
            <input type="text" class="form-input" id="year" inputmode="numeric" pattern="[0-9]+" maxlength="4" placeholder="YYYY">
            <p class="error" id="year-error">This is error</p>
          </div>
        </div>
        <div class="form-footer">
          <button type="button" id="btn" class="form-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="46" height="44" viewBox="0 0 46 44"><g fill="none" stroke="#FFF" stroke-width="2">
              <path d="M1 22.019C8.333 21.686 23 25.616 23 44M23 44V0M45 22.019C37.667 21.686 23 25.616 23 44"/></g>
            </svg>
          </button>
        </div>
      </form>

      <div class="calculator-output">
        <ul class="output">
          <li class="output-item" id="output-year">
            <span class="output-result">--</span>
            <span class="output desc">years</span>
          </li>
          <li class="output-item" id="output-month">
            <span class="output-result">--</span>
            <span class="output desc">months</span>
          </li>
          <li class="output-item" id="output-day">
            <span class="output-result">--</span>
            <span class="output desc">days</span>
          </li>
        </ul>
      </div>
    </section>
  </main>
  <!-- Day
  DD

  Month
  MM

  Year
  YYYY

  -- years
  -- months
  -- days -->

</body>
</html>
